    <main class="divider">
      <section class="checkout">
        <h2>Review &amp; Place Your Order</h2>

        <form id="checkout" class="checkout-form">
          <fieldset>
            <legend>Customer Information</legend>

            <label for="fname">First Name</label>
            <input id="fname" name="fname" type="text" required />

            <label for="lname">Last Name</label>
            <input id="lname" name="lname" type="text" required />
          </fieldset>

          <fieldset>
            <legend>Address</legend>

            <label for="street">Street Address</label>
            <input id="street" name="street" type="text" required />

            <label for="city">City</label>
            <input id="city" name="city" type="text" required />

            <label for="state">State</label>
            <input id="state" name="state" type="text" required />

            <label for="zip">Zip Code</label>
            <input id="zip" name="zip" type="text" required />
          </fieldset>

          <fieldset>
            <legend>Payment</legend>

            <label for="cardNumber">Credit Card Number</label>
            <input id="cardNumber" name="cardNumber" type="text" required />

            <label for="expiration">Expiration Date</label>
            <input
              id="expiration"
              name="expiration"
              type="text"
              placeholder="MM/YY"
              required
            />

            <label for="code">Security Code</label>
            <input id="code" name="code" type="text" required />
          </fieldset>

          <fieldset>
            <legend>Order Summary</legend>

            <div class="order-summary">
              <p>
                Items:
                <span id="num-items">0</span>
              </p>

              <p>
                Subtotal:
                <span id="subtotal">$0.00</span>
              </p>

              <p>
                Tax:
                <span id="tax">$0.00</span>
              </p>

              <p>
                Shipping:
                <span id="shipping">$0.00</span>
              </p>

              <p class="order-total">
                <strong>
                  Total:
                  <span id="order-total">$0.00</span>
                </strong>
              </p>
            </div>
          </fieldset>

          <button id="checkout-submit" type="submit">Checkout</button>
        </form>
      </section>
    </main>

    <footer>&copy;NOT a real business</footer>
